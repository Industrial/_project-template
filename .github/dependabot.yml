version: 2
updates:
  # Every `uses:` is pinned by full commit SHA with a `# vX.Y.Z` comment;
  # Dependabot bumps the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    labels: [dependencies, github-actions]
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        update-types: [patch, minor]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    labels: [dependencies, rust]
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-patch-minor:
        update-types: [patch, minor]
