# cargo-deny — https://embarkstudios.github.io/cargo-deny/
# `moon run :deny` (pre-push and CI) runs every check below.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported for direct dependencies only; a transitive
# one is the direct dependency's problem to fix.
unmaintained = "workspace"
yanked = "deny"
# Add an ignore only with a reason and a way out, e.g.
# { id = "RUSTSEC-0000-0000", reason = "no fix upstream; not reachable from our use of X" },
ignore = []

[licenses]
# Permissive licences, plus the workspace's own. Anything else fails the gate
# until a person decides to allow it here.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC-BY-SA-4.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The allow list is a policy for dependencies yet to come, not an inventory.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are `publish = false`; their licence is not a dependency's.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry no version; that is fine.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
