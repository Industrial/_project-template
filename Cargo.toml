[workspace]
resolver = "2"
members = ["crates/web", "crates/migration"]
default-members = ["crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC-BY-SA-4.0"
publish = false

[workspace.dependencies]
loco-rs = { version = "1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = { version = "0.1" }
validator = { version = "0.20" }

migration = { path = "crates/migration" }

# blaze runs proc macros as sandboxed WebAssembly so it can cache what they
# expand to; `ouroboros_macro` does not build that way. Expanding it natively is
# the narrow fix — do not add a `version` key here, blaze would then download
# and run its own release instead of the Nix-pinned one.
[workspace.metadata.blaze]
native-proc-macros = ["ouroboros_macro"]
