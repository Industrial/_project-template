# https://moonrepo.dev/docs/config/project
id: 'frontend'
language: 'typescript'
layer: 'application'
tasks:
  typecheck:
    description: 'Typecheck Solid frontend (tsc --noEmit)'
    deps: ['test-loco-webapp:format']
    command: 'bun'
    args: ['run', 'typecheck']
    inputs:
      - 'package.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'env.ts'
      - 'src/**/*.{ts,tsx}'
      - '!node_modules/**'
      - '!dist/**'
    options:
      cache: true
      outputStyle: buffer-only-failure
  check:
    description: 'Frontend static checks (typecheck)'
    deps: ['test-loco-webapp:format', 'test-loco-webapp:biome', 'test-loco-webapp:oxlint', '~:typecheck']
    command: 'bash'
    args: ['-c', ':']
    options:
      cache: true
      outputStyle: buffer-only-failure
  lint:
    description: 'Frontend lint gate (workspace biome/oxlint + typecheck)'
    deps: ['test-loco-webapp:format', 'test-loco-webapp:biome', 'test-loco-webapp:oxlint', '~:typecheck']
    command: 'bash'
    args: ['-c', ':']
    options:
      cache: true
      outputStyle: buffer-only-failure
  test:
    description: 'vitest run (once)'
    deps: ['test-loco-webapp:format', '~:lint']
    command: 'bun'
    args: ['run', 'test', '--', 'run']
    inputs:
      - 'package.json'
      - 'vitest*.ts'
      - 'src/**/*.{ts,tsx}'
      - '!node_modules/**'
      - '!dist/**'
    options:
      cache: true
      outputStyle: buffer-only-failure
  build:
    description: 'vite production build'
    deps: ['test-loco-webapp:format', '~:test']
    command: 'bun'
    args: ['run', 'build']
    inputs:
      - 'package.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'env.ts'
      - 'server.js'
      - 'src/**/*'
      - 'public/**/*'
      - '!node_modules/**'
      - '!dist/**'
    options:
      cache: true
      outputStyle: buffer-only-failure
