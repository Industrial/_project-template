[package]
name = "test-loco-webapp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "test_loco_webapp-cli"

[dependencies]
loco-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { workspace = true }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { workspace = true }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { workspace = true }
validator = { workspace = true }
uuid = { workspace = true }
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }
axum-extra = { version = "0.10", features = ["form"] }

domain-core = { workspace = true }
domain-workspace = { workspace = true }
domain-page = { workspace = true }
domain-block = { workspace = true }
domain-share = { workspace = true }
domain-comment = { workspace = true }

[features]
default = []
cli = []

[[bin]]
name = "test_loco_webapp-cli"
path = "src/bin/main.rs"
required-features = ["cli"]

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
