# Configuration for cargo-nextest test runner
# See https://nexte.st/book/config/ for full documentation

[profile.default]
retries = 3
fail-fast = false
max-fail = 5
test-timeout = "60s"
slow-timeout = { period = "5s", terminate-after = 1 }

# Loco SQLite tests share one DB + dangerously_recreate. #[serial] does not
# serialize across nextest processes, so run this package with one thread.
[test-groups]
loco_sqlite = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(test-loco-webapp)'
test-group = 'loco_sqlite'

[profile.ci]
retries = 1
fail-fast = true
test-timeout = "120s"
slow-timeout = { period = "10s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'package(test-loco-webapp)'
test-group = 'loco_sqlite'
