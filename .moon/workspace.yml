# https://moonrepo.dev/docs/config/workspace
$schema: './cache/schemas/workspace.json'
# extends: './shared/workspace.yml'

# Never hash build outputs—only source and config. Avoids warnings when target/
# is cleaned or incremental artifacts are missing.
hasher:
  ignorePatterns:
    - '**/target/**'
    - '**/node_modules/**'
    - '**/.devenv/**'
    - '**/tmp/**'
    - '**/frontend/dist/**'
    - '**/.git/**'
# Root application (`moon.yml`) plus every workspace crate under `crates/`.
# `moon run :check` / `:test` / `:build` fans out across all projects; use
# `moon run domain-core:test` (etc.) for a single crate.
projects:
  - '.'
  - 'crates/*'
vcs:
  client: 'git'
  defaultBranch: 'main'
