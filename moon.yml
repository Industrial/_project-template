# Root package tasks (workspace tooling)
# https://moonrepo.dev/docs/config/project
id: 'test-loco-webapp'
language: 'rust'
layer: 'application'
tasks:
  # Workspace gate tasks (check/clippy/lint/test/build/coverage) depend on this so treefmt always runs first.
  # Crate-scoped check/clippy/test/coverage/build/audit/docs/bench/check-docs live under crates/*/moon.yml.
  format:
    description: 'Format the workspace with treefmt (Rust, Nix, shell, JS/TS, YAML, TOML)'
    command: 'treefmt'
    inputs:
      - 'treefmt.toml'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
      - '.github/workflows/*.yml'
      - '!**/node_modules/**'
      - '!**/.devenv/**'
      - '!**/tmp/**'
      - '!**/target/**'
      - '!**/frontend/dist/**'
    options:
      cache: false
      outputStyle: buffer-only-failure
  ci-format:
    description: 'Format check for CI (treefmt with fail-on-change)'
    command: 'treefmt'
    args: ['--config-file', 'treefmt.ci.toml']
    inputs:
      - 'treefmt.ci.toml'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
      - '.github/workflows/*.yml'
      - '!**/node_modules/**'
      - '!**/.devenv/**'
      - '!**/tmp/**'
      - '!**/target/**'
      - '!**/frontend/dist/**'
    options:
      cache: false
      outputStyle: buffer-only-failure
  start:
    description: 'Start the Loco app (cargo run --features cli -- start)'
    command: 'bash'
    args: ['-lc', 'cargo run -p test-loco-webapp --features cli -- start']
    options:
      cache: false
      outputStyle: stream
  fix:
    description: 'Auto-fix with cargo fix and clippy --fix'
    command: 'bash'
    args: ['-c', 'cargo fix --allow-dirty --allow-staged --workspace --all-features && cargo clippy --fix --allow-dirty --allow-staged --workspace --all-features -- -D warnings']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
      outputStyle: buffer-only-failure
