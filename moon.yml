# Root-level workspace tasks
# https://moonrepo.dev/docs/config/project
id: 'project-template'
language: 'rust'
layer: 'application'
workspace:
  inheritedTasks:
    exclude:
      - check
      - test
tasks:
  # Moon runs cargo; blaze is the by-hand development loop.
  #
  # These were `blaze … --workspace` with `cache: false`. blaze keeps the
  # workspace compiled in a daemon that holds a worker per (crate, flag-set) —
  # found at 15 workers on 23.3 GB in one session — which is worth paying for
  # an inner loop a human drives in seconds, and not for a gate that wants one
  # answer and exits. Measured in the redox repo, full push gate:
  #   cold   203s / 22.6 GB peak (blaze)  ->  24s / 0.4 GB (cargo)
  #   no-op  a whole workspace rebuild    ->  0.6s, nearly all cached
  # Type `blaze check` / `blaze test` by hand while developing; moon runs
  # cargo. See the redox repo's AGENTS.md for the full writeup.
  format:
    description: 'Format the workspace with treefmt (Rust, Nix, shell, JS/TS, YAML, TOML)'
    command: 'treefmt'
    inputs:
      - 'treefmt.toml'
      - '.git/**/*'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
      - '.github/workflows/*.yml'
    options:
      cache: false
      outputStyle: buffer-only-failure
  ci-format:
    description: 'Format check for CI (treefmt with fail-on-change)'
    command: 'treefmt'
    args: ['--config-file', 'treefmt.ci.toml']
    inputs:
      - 'treefmt.ci.toml'
      - '.git/**/*'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
      - '.github/workflows/*.yml'
    options:
      cache: false
      outputStyle: buffer-only-failure
  audit:
    description: 'Run cargo audit for known Rust security advisories'
    command: 'cargo'
    args: ['audit']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
    options:
      outputStyle: buffer-only-failure
  coverage:
    description: 'Run tests with llvm-cov and generate HTML coverage report'
    command: 'cargo'
    args: ['llvm-cov', 'nextest']
    deps: ['~:format']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
  # blaze is the default Rust build command: it keeps the workspace compiled in
  # a daemon and rebuilds only what changed. Moon caching stays off for the
  # blaze targets — blaze has its own content-addressed store and is already
  # faster than a moon cache lookup, and double-caching only hides staleness.
  build:
    description: 'Build the workspace (cargo)'
    command: 'cargo'
    args: ['build', '--workspace']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  check:
    description: 'Check the workspace compiles (cargo)'
    command: 'cargo'
    args: ['check', '--workspace', '--all-features', '--all-targets']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  cargo-build:
    description: 'Build the workspace with cargo (rustc verification path)'
    command: 'cargo'
    args: ['build']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  cargo-check:
    description: 'Check the workspace with cargo — rustc is the final word on the verdict'
    command: 'cargo'
    args: ['check', '--workspace', '--all-features']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  lint:
    description: 'Run fmt --check and clippy'
    command: 'bash'
    args: ['-c', 'cargo fmt --all -- --check && cargo clippy --workspace -- -D warnings']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      outputStyle: buffer-only-failure
  test:
    description: 'Run tests (nextest, then the doctests)'
    command: 'bash'
    args:
      - '-c'
      - 'cargo nextest run --workspace --all-features && cargo test --doc --workspace --all-features'
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - 'tests/**/*'
    options:
      cache: true
      outputStyle: buffer-only-failure
  cargo-test:
    description: 'Run tests with nextest under rustc — the verification path'
    command: 'cargo'
    args: ['nextest', 'run']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - 'tests/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
  # Stays cargo: `blaze doc` panics in blaze_doc::places::place as of
  # 0.20261030.1. blaze has no clippy, fmt, audit or llvm-cov subcommand at
  # all, so :lint, :audit, :coverage, :fix and :bench are cargo's too.
  docs:
    description: 'Build documentation'
    command: 'cargo'
    args: ['doc', '--no-deps', '--all-features']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  fix:
    description: 'Auto-fix with cargo fix and clippy --fix'
    command: 'bash'
    args: ['-c', 'cargo fix --allow-dirty --allow-staged --workspace --all-features && cargo clippy --fix --allow-dirty --allow-staged --workspace --all-features -- -D warnings']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
      outputStyle: buffer-only-failure
  bench:
    description: 'Run benchmarks (no-op if no benches)'
    command: 'bash'
    args: ['-c', 'if [ -d benches ]; then cargo bench; else echo "No benches/ directory"; fi']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - 'benches/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
  check-docs:
    description: 'Build docs and run clippy with missing_docs_in_private_items'
    command: 'bash'
    args: ['-c', 'RUSTDOCFLAGS="" cargo doc --all-features --no-deps 2>&1 | tee log/docs-warnings.log | grep -E "(warning|error|Documenting|Finished)" || true && cargo clippy --lib --all-features -- -D warnings -W clippy::missing_docs_in_private_items']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      outputStyle: buffer-only-failure
