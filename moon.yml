# Root-level workspace tasks — https://moonrepo.dev/docs/config/project
#
# Gates (pre-commit, pre-push, CI) run cargo. blaze is the by-hand inner loop:
# `moon run :dev-check` / `:dev-test`, or type `blaze check` / `blaze test`.
#
# The gates were once `blaze … --workspace` with `cache: false`. blaze keeps
# the workspace compiled in a daemon that holds a worker per (crate, flag-set)
# — found at 15 workers on 23.3 GB in one session — which is worth paying for
# an inner loop a human drives in seconds, and not for a gate that wants one
# answer and exits. Measured in the redox repo, full push gate:
#   cold   203s / 22.6 GB peak (blaze)  ->  24s / 0.4 GB (cargo)
#   no-op  a whole workspace rebuild    ->  0.6s, nearly all cached
# blaze also has no clippy, fmt, doc (it panics), nextest, llvm-cov or deny,
# and its verdict is its own front end's rather than rustc's.
id: 'project-template'
language: 'rust'
layer: 'application'
fileGroups:
  rust:
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
    - 'crates/**/*'
  formatted:
    - '**/*.rs'
    - '**/*.nix'
    - '**/*.sh'
    - '**/*.{js,jsx,ts,tsx,json}'
    - '**/*.{yml,yaml}'
    - '**/*.toml'
tasks:
  # ── Formatting ──────────────────────────────────────────────────────────────
  format:
    description: 'Format everything with treefmt (Rust, Nix, shell, JS/TS, YAML, TOML, Actions)'
    command: 'treefmt'
    inputs: ['treefmt.toml', '@group(formatted)']
    options:
      cache: false
      outputStyle: buffer-only-failure
  ci-format:
    description: 'Fail if anything is unformatted (treefmt.ci.toml: fail-on-change)'
    command: 'treefmt'
    args: ['--config-file', 'treefmt.ci.toml']
    inputs: ['treefmt.ci.toml', '@group(formatted)']
    options:
      cache: false
      outputStyle: buffer-only-failure
  # ── Gates (cargo) ───────────────────────────────────────────────────────────
  check:
    description: 'Type-check every target and feature'
    command: 'cargo'
    args: ['check', '--workspace', '--all-targets', '--all-features']
    inputs: ['@group(rust)']
    options:
      outputStyle: buffer-only-failure
  lint:
    description: 'rustfmt --check and clippy, warnings denied'
    command: 'bash'
    args:
      - '-c'
      - 'cargo fmt --all -- --check && cargo clippy --workspace --all-targets --all-features -- -D warnings'
    inputs: ['@group(rust)', 'rustfmt.toml']
    options:
      outputStyle: buffer-only-failure
  build:
    description: 'Build the workspace'
    command: 'cargo'
    args: ['build', '--workspace', '--all-targets']
    inputs: ['@group(rust)']
    options:
      outputStyle: buffer-only-failure
  test:
    description: 'nextest (unit + integration), then the doctests nextest cannot run'
    command: 'bash'
    args:
      - '-c'
      - 'cargo nextest run --workspace --all-features && cargo test --doc --workspace --all-features'
    inputs: ['@group(rust)', '.config/nextest.toml']
    options:
      outputStyle: buffer-only-failure
  docs:
    description: 'Build the API docs, rustdoc warnings denied'
    command: 'cargo'
    args: ['doc', '--workspace', '--no-deps', '--all-features']
    env:
      RUSTDOCFLAGS: '-D warnings'
    inputs: ['@group(rust)']
    options:
      outputStyle: buffer-only-failure
  deny:
    description: 'cargo-deny: advisories, licences, bans, sources'
    command: 'cargo'
    args: ['deny', '--all-features', 'check']
    inputs: ['Cargo.toml', 'Cargo.lock', 'deny.toml']
    options:
      # The advisory database changes under an unchanged Cargo.lock.
      cache: false
      outputStyle: buffer-only-failure
  # ── Occasional ──────────────────────────────────────────────────────────────
  coverage:
    description: 'nextest under llvm-cov; HTML report in target/llvm-cov/html'
    command: 'cargo'
    args: ['llvm-cov', 'nextest', '--workspace', '--all-features', '--html']
    inputs: ['@group(rust)']
    options:
      cache: false
      runInCI: false
  fix:
    description: 'Apply cargo fix and clippy --fix'
    command: 'bash'
    args:
      - '-c'
      - 'cargo fix --allow-dirty --allow-staged --workspace --all-targets --all-features && cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets --all-features'
    options:
      cache: false
      runInCI: false
  bench:
    description: 'Run benchmarks'
    command: 'cargo'
    args: ['bench', '--workspace']
    inputs: ['@group(rust)']
    options:
      cache: false
      runInCI: false
  # ── Inner loop (blaze) — local only, never a gate ───────────────────────────
  dev-check:
    description: 'blaze check — the fast by-hand verdict from the daemon'
    command: 'blaze'
    args: ['check', '--workspace', '--all-targets']
    options:
      cache: false
      runInCI: false
      outputStyle: stream
  dev-test:
    description: 'blaze test — unit, integration and doctests, incrementally'
    command: 'blaze'
    args: ['test', '--workspace']
    options:
      cache: false
      runInCI: false
      outputStyle: stream
