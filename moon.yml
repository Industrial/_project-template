# Root package tasks (workspace tooling)
# https://moonrepo.dev/docs/config/project
id: 'test-loco-webapp'
language: 'rust'
layer: 'application'
tasks:
  # Workspace gate tasks (check/clippy/lint/test/build/coverage) depend on this so treefmt always runs first.
  # Crate-scoped check/clippy/test/coverage/build/audit/docs/bench/check-docs live under crates/*/moon.yml.
  format:
    description: 'Format the workspace with treefmt (Rust, Nix, shell, JS/TS, YAML, TOML)'
    command: 'treefmt'
    inputs:
      - 'treefmt.toml'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
      - '.github/workflows/*.yml'
      - '!**/node_modules/**'
      - '!**/.devenv/**'
      - '!**/tmp/**'
      - '!**/target/**'
      - '!**/frontend/dist/**'
      - '!**/frontend_old/**'
    options:
      cache: false
      outputStyle: buffer-only-failure
  ci-format:
    description: 'Format check for CI (treefmt with fail-on-change)'
    command: 'treefmt'
    args: ['--config-file', 'treefmt.ci.toml']
    inputs:
      - 'treefmt.ci.toml'
      - 'biome.json'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
      - '.github/workflows/*.yml'
      - '!**/node_modules/**'
      - '!**/.devenv/**'
      - '!**/tmp/**'
      - '!**/target/**'
      - '!**/frontend/dist/**'
      - '!**/frontend_old/**'
    options:
      cache: false
      outputStyle: buffer-only-failure
  oxlint:
    description: 'oxlint with deny-warnings (frontend)'
    deps: ['~:format']
    command: 'bun'
    args: ['run', 'oxlint']
    inputs:
      - 'package.json'
      - '.oxlintrc.json'
      - 'crates/web/frontend/**/*.{ts,tsx,js,jsx}'
      - '!**/node_modules/**'
      - '!**/dist/**'
      - '!**/frontend_old/**'
    options:
      cache: true
      outputStyle: buffer-only-failure
  biome:
    description: 'biome check (frontend)'
    deps: ['~:format']
    command: 'bun'
    args: ['run', 'biome']
    inputs:
      - 'biome.json'
      - 'package.json'
      - 'crates/web/frontend/**/*.{ts,tsx,js,jsx,json}'
      - '!**/node_modules/**'
      - '!**/dist/**'
      - '!**/frontend_old/**'
    options:
      cache: true
      outputStyle: buffer-only-failure
  typecheck:
    description: 'biome + frontend tsc --noEmit'
    deps: ['~:format', '~:oxlint', '~:biome']
    command: 'bun'
    args: ['run', 'typecheck']
    inputs:
      - 'biome.json'
      - 'package.json'
      - 'crates/web/frontend/package.json'
      - 'crates/web/frontend/tsconfig*.json'
      - 'crates/web/frontend/src/**/*.{ts,tsx}'
      - '!**/node_modules/**'
      - '!**/dist/**'
    options:
      cache: true
      outputStyle: buffer-only-failure
  lint:
    description: 'Workspace TS/JS gate: format + oxlint + biome + typecheck'
    deps: ['~:format', '~:oxlint', '~:biome', '~:typecheck']
    command: 'bash'
    args: ['-c', ':']
    options:
      cache: true
      outputStyle: buffer-only-failure
  start:
    description: 'Start the Loco app (cargo run --features cli -- start)'
    command: 'bash'
    args: ['-lc', 'cargo run -p test-loco-webapp --features cli -- start']
    options:
      cache: false
      outputStyle: stream
  fix:
    description: 'Auto-fix with cargo fix and clippy --fix'
    command: 'bash'
    args: ['-c', 'cargo fix --allow-dirty --allow-staged --workspace --all-features && cargo clippy --fix --allow-dirty --allow-staged --workspace --all-features -- -D warnings']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
      outputStyle: buffer-only-failure
